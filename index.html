<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>여행 트레커</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,-25..0&display=swap" rel="stylesheet">
<style>
  body{font-family:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;}
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;line-height:1;vertical-align:middle;}
</style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen min-h-[100dvh] flex items-center justify-center p-6">
<div class="w-full max-w-2xl">
  <h1 class="flex items-center justify-center gap-2 text-2xl sm:text-3xl font-bold text-center mb-2">
    <span class="material-symbols-outlined text-sky-500 text-[.85em]">location_on</span>
    여행 트레커
  </h1>
  <p class="text-slate-500 text-sm text-center mb-8 leading-relaxed">사진 속 GPS로 여행 경로를 그려주는 지도. 보고 싶은 방식을 골라주세요.</p>
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
    <a href="focus.html" class="block bg-white border border-slate-100 rounded-2xl p-5 shadow-sm hover:shadow-md hover:border-sky-200 transition-all">
      <span class="w-11 h-11 rounded-xl bg-sky-50 text-sky-500 flex items-center justify-center mb-3">
        <span class="material-symbols-outlined text-2xl">videocam</span>
      </span>
      <div class="font-bold text-base mb-1.5">포커스 지도</div>
      <div class="text-slate-500 text-xs leading-relaxed">카메라가 여행자를 따라 이동하며 줌인/줌아웃하는 시네마틱 연출</div>
    </a>
    <a href="overview.html" class="block bg-white border border-slate-100 rounded-2xl p-5 shadow-sm hover:shadow-md hover:border-sky-200 transition-all">
      <span class="w-11 h-11 rounded-xl bg-sky-50 text-sky-500 flex items-center justify-center mb-3">
        <span class="material-symbols-outlined text-2xl">map</span>
      </span>
      <div class="font-bold text-base mb-1.5">전체지도</div>
      <div class="text-slate-500 text-xs leading-relaxed">모든 핀이 보이도록 카메라를 고정하고, 위치만 경로를 따라 이동</div>
    </a>
    <a href="overview.html#settings" class="block bg-white border border-slate-100 rounded-2xl p-5 shadow-sm hover:shadow-md hover:border-sky-200 transition-all">
      <span class="w-11 h-11 rounded-xl bg-sky-50 text-sky-500 flex items-center justify-center mb-3">
        <span class="material-symbols-outlined text-2xl">tune</span>
      </span>
      <div class="font-bold text-base mb-1.5">설정</div>
      <div class="text-slate-500 text-xs leading-relaxed">테마 색상, 도착 연출, 지도 모드를 미리 정하고 시작</div>
    </a>
  </div>
</div>
</body>
</html>
